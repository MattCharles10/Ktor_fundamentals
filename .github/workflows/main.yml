name: Kotlin Build

on:
  push:
    branches: [main, fundamental1]
  pull_request:
    branches: [main, fundamental1]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
      - name: Build with Gradle
        run: ./gradlew clean build
